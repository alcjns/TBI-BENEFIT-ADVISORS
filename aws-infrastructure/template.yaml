AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Contact form API for TBI Benefit Advisors

Parameters:
  RecipientEmail:
    Type: String
    Default: bromleyinstitute@gmail.com
  SenderEmail:
    Type: String
    Default: bromleyinstitute@gmail.com
    Description: A sender address or domain verified in Amazon SES

Resources:
  ContactApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - content-type
        AllowMethods:
          - POST

  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      InlineCode: |
        const { SESClient, SendEmailCommand } = require("@aws-sdk/client-ses");
        const ses = new SESClient({});
        const clean = (value, max) => String(value || "").trim().slice(0, max);
        exports.handler = async (event) => {
          const response = (statusCode, body) => ({ statusCode, headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
          try {
            if (Buffer.byteLength(event.body || "") > 12000) return response(413, { error: "Request too large" });
            const data = JSON.parse(event.body || "{}");
            if (data.website) return response(200, { ok: true });
            const firstName = clean(data.firstName, 80);
            const lastName = clean(data.lastName, 80);
            const email = clean(data.email, 254);
            const phone = clean(data.phone, 40);
            const message = clean(data.message, 2000);
            if (!firstName || !lastName || !message || !data.consent || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
              return response(400, { error: "Invalid submission" });
            }
            const text = [`Name: ${firstName} ${lastName}`, `Email: ${email}`, `Phone: ${phone || "Not provided"}`, "", "Message:", message].join("\n");
            await ses.send(new SendEmailCommand({
              Source: process.env.SENDER_EMAIL,
              Destination: { ToAddresses: [process.env.RECIPIENT_EMAIL] },
              ReplyToAddresses: [email],
              Message: {
                Subject: { Data: `Website inquiry from ${firstName} ${lastName}` },
                Body: { Text: { Data: text } }
              }
            }));
            return response(200, { ok: true });
          } catch (error) {
            console.error("Contact form error", error?.name || "UnknownError");
            return response(500, { error: "Unable to send" });
          }
        };
      Environment:
        Variables:
          RECIPIENT_EMAIL: !Ref RecipientEmail
          SENDER_EMAIL: !Ref SenderEmail
      Policies:
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: "*"
      Events:
        Submit:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContactApi
            Path: /contact
            Method: POST

Outputs:
  ContactApiUrl:
    Description: Add this value to Amplify as CONTACT_API_URL
    Value: !Sub "https://${ContactApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/contact"
